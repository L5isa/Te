<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>美化编辑器</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/136/hans-medium/result.css">
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/144/main/result.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}

:root{
  --page-bg:#fffffe;--card-bg:#fffffe;
  --text-color:#000;--text-body:#1c1c1e;--text-secondary:#536471;
  --follow-bg:#000;--follow-text:#fff;
  --editor-bg:#f5f5f5;--editor-border:#e0e0e0;
  --editor-accent:#1d9bf0;--editor-card:#fff;
}
body{
  background:var(--editor-bg);color:var(--text-color);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s,color .3s;
}
body.dark #tweetPage{
  --page-bg:#000;--card-bg:#000;
  --text-color:#D7D7D7;--text-body:#D7D7D7;--text-secondary:#73787D;
  --follow-bg:#fff;--follow-text:#000;
  --editor-bg:#0a0a0a;--editor-border:#2a2a2a;--editor-card:#161616;
}

.editor-panel{
  width:100%;min-height:100vh;padding:20px 16px 100px;
  display:flex;flex-direction:column;gap:14px;background:var(--editor-bg);
}
body.preview-mode .editor-panel{display:none}

.editor-header{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.editor-header h2{font-size:20px;font-weight:700;color:var(--text-color)}

.editor-section{
  background:var(--editor-card);border:1px solid var(--editor-border);
  border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;
}
.editor-section-title{
  font-size:12px;font-weight:700;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.5px;
}
.editor-row{display:flex;flex-direction:column;gap:4px}
.editor-row label{font-size:13px;font-weight:600;color:var(--text-color)}
.editor-row input[type="text"],
.editor-row input[type="number"],
.editor-row input[type="url"],
.editor-row select{
  width:100%;padding:10px 12px;border:1px solid var(--editor-border);
  border-radius:10px;background:var(--editor-bg);color:var(--text-color);
  font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;
}
.editor-row input:focus,.editor-row select:focus{border-color:var(--editor-accent)}
.editor-row input[readonly]{opacity:.5}

.editor-inline{display:flex;gap:10px;align-items:flex-end}
.editor-inline .editor-row{flex:1}

.editor-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.editor-toggle label{font-size:13px;font-weight:600;color:var(--text-color)}
.toggle-switch{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:#ccc;border-radius:26px;cursor:pointer;transition:background .3s;
}
.toggle-slider::before{
  content:"";position:absolute;width:20px;height:20px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:transform .3s;
}
.toggle-switch input:checked+.toggle-slider{background:var(--editor-accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px)}

.template-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.template-bar::-webkit-scrollbar{display:none}
.template-tab{
  padding:10px 20px;border:1.5px solid var(--editor-border);border-radius:12px;
  background:var(--editor-card);color:var(--text-color);
  font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap;
  cursor:pointer;transition:all .2s;flex-shrink:0;
}
.template-tab.active{background:var(--text-color);color:var(--page-bg);border-color:var(--text-color)}
.template-tab:disabled{opacity:.35;cursor:not-allowed}

.char-bar{display:flex;gap:8px;align-items:center}
.char-bar select{
  flex:1;padding:10px 12px;border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-bg);color:var(--text-color);font-size:14px;font-family:inherit;outline:none;
}
.char-btn{
  padding:10px 14px;border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-card);color:var(--text-color);
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:all .15s;
}
.char-btn:active{transform:scale(.95)}
.char-btn-danger{color:#ef4444}
body.dark .char-btn-danger{color:#f87171}

.avatar-input-row{display:flex;gap:8px;align-items:center}
.avatar-input-row input[type="url"]{flex:1;min-width:0}
.avatar-upload-label{
  padding:10px 14px;border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-card);color:var(--editor-accent);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:all .15s;display:flex;align-items:center;gap:4px;
}
.avatar-upload-label:active{transform:scale(.95)}
.avatar-thumb{
  width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
  border:2px solid var(--editor-border);background:var(--editor-bg);
  display:none;align-items:center;justify-content:center;
}
.avatar-thumb.has-img{display:flex}
.avatar-thumb img{width:100%;height:100%;object-fit:cover;display:block}

.rich-toolbar{
  display:flex;align-items:center;gap:2px;padding:4px;
  background:var(--editor-bg);border-radius:10px;flex-wrap:wrap;
}
.tool-btn{
  width:36px;height:34px;border:none;border-radius:8px;background:transparent;
  color:var(--text-color);font-size:15px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;
}
.tool-btn:active{background:var(--editor-border)}
.tool-sep{width:1px;height:20px;background:var(--editor-border);margin:0 2px;flex-shrink:0}

.hl-bar{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  background:var(--editor-bg);border-radius:10px;flex-wrap:wrap;
}
.hl-label{font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap;margin-right:2px}
.hl-dot{
  width:26px;height:26px;border:2.5px solid transparent;border-radius:50%;
  cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0;
}
.hl-dot:active{transform:scale(.88)}
.hl-dot-clear{
  background:var(--editor-card)!important;border:1.5px solid var(--editor-border)!important;
  font-size:11px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;
}

.rich-editor{
  position:relative;min-height:140px;max-height:400px;padding:12px;
  border:1px solid var(--editor-border);border-radius:10px;
  background:var(--editor-bg);color:var(--text-color);
  font-size:15px;font-family:inherit;line-height:1.6;outline:none;
  overflow-y:auto;word-wrap:break-word;overflow-wrap:anywhere;transition:border-color .2s;
}
.rich-editor:focus{border-color:var(--editor-accent)}
.rich-editor.is-empty::before{
  content:attr(data-placeholder);color:var(--text-secondary);pointer-events:none;
}
.rich-editor mark {
  border-radius: 2px;
  padding: 1px 3px;
  color: inherit;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.rich-editor b,.rich-editor strong{font-weight:700}
.rich-editor i,.rich-editor em{font-style:italic}
.rich-editor u{text-decoration:underline}
.rich-editor s,.rich-editor strike{text-decoration:line-through}
.rich-editor span[style*="background-color"]{border-radius:2px;padding:1px 0}

.action-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:opacity .2s,transform .1s;
}
.action-btn:active{transform:scale(.97)}
.btn-theme{
  background:var(--text-color);color:var(--page-bg);
  padding:10px 16px;font-size:14px;width:auto;border-radius:10px;
}

.floating-preview-btn{
  position:fixed;z-index:9999;bottom:24px;left:50%;transform:translateX(-50%);
  padding:14px 32px;border:none;border-radius:50px;
  background:var(--editor-accent);color:#fff;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;
  box-shadow:0 4px 20px rgba(29,155,240,.4);
  transition:opacity .2s,transform .1s;
}
.floating-preview-btn:active{transform:translateX(-50%) scale(.95)}
body.preview-mode .floating-preview-btn{display:none}

.toast{
  position:fixed;z-index:99999;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:10px 24px;border-radius:50px;background:rgba(0,0,0,.8);color:#fff;
  font-size:14px;font-weight:600;font-family:inherit;
  pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#tweetPage{display:none}
body.preview-mode #tweetPage{
  display:flex;flex-direction:column;background:var(--page-bg);overflow:hidden;z-index:10000;
}

.preview-actions{display:none}
body.preview-mode .preview-actions{
  display:flex;position:fixed;z-index:10001;bottom:90px;left:50%;transform:translateX(-50%);
  gap:10px;opacity:1;transition:opacity .3s;
}
body.preview-mode .preview-actions.fade-out{opacity:0;pointer-events:none}
.preview-action-btn{
  padding:10px 22px;border:none;border-radius:50px;
  background:rgba(0,0,0,.65);color:#fff;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  white-space:nowrap;transition:transform .1s;
}
.preview-action-btn:active{transform:scale(.95)}
.preview-action-btn.btn-save{background:rgba(29,155,240,.85)}

.save-modal{
  display:none;position:fixed;z-index:99999;inset:0;
  align-items:center;justify-content:center;flex-direction:column;
}
.save-modal.show{display:flex}
.save-modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.save-modal-body{
  position:relative;z-index:1;max-width:90vw;max-height:88vh;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;
}
.save-modal-hint{color:#fff;font-size:14px;font-weight:600;text-align:center}
.save-modal-img{
  max-width:100%;max-height:68vh;border-radius:10px;
  box-shadow:0 4px 30px rgba(0,0,0,.5);display:block;
}
.save-modal-btns{display:flex;gap:10px}
.save-modal-btn{
  padding:10px 28px;border:none;border-radius:50px;
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
}
.save-modal-btn-download{background:var(--editor-accent);color:#fff}
.save-modal-btn-close{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px)}

.top-nav-wrapper{z-index:10;width:100%;flex-shrink:0;padding:0 30px 0;;background:var(--page-bg)}
.top-nav-bar{position:relative;width:100%;height:50px;overflow:hidden}
.top-nav-img{width:108%;max-width:none;height:auto;display:block;margin-left:-4%;pointer-events:none}
.top-nav-title{
  position:absolute;z-index:5;top:60%;left:50%;transform:translate(-50%,-50%);
  color:var(--text-color);font-size:16.5px;font-weight:550;line-height:1;
  letter-spacing:.5px;white-space:nowrap;pointer-events:none;
}
.top-nav-grok{
  position:absolute;z-index:5;top:62%;right:10%;transform:translateY(-50%);
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.top-nav-grok svg{width:100%;height:100%;display:block;fill:var(--text-color)}

.scroll-content{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:10px 30px 30px;-webkit-overflow-scrolling:touch;
}
.tweet-card{position:relative;z-index:1;width:100%;margin:14px 0;color:var(--text-color);background:var(--card-bg);overflow:visible}
.tweet-header{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tweet-avatar{
  position:relative;z-index:2;width:45px;height:45px;flex-shrink:0;
  overflow:hidden;border-radius:50%;background:#e5e5ea;
}
.tweet-avatar img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.tweet-user-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.tweet-display-name{
  display:flex;align-items:center;gap:3px;min-width:0;
  color:var(--text-color);font-size:15px;font-weight:550;line-height:1.3;overflow-wrap:anywhere;
}
.tweet-verified{width:14px;height:14px;flex-shrink:0;display:inline-flex}
.tweet-verified svg{width:100%;height:100%;display:block}
.tweet-handle{color:var(--text-secondary);font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tweet-header-action{flex-shrink:0;margin-top:-15px;margin-right:-5px}
.tweet-header-action-img{width:62px;height:auto;display:block;pointer-events:none}

.tweet-translate-hint{
  display:none;align-items:center;gap:4px;margin-top:1px;margin-bottom:3px;
  color:var(--text-secondary);font-size:12px;font-weight:590;line-height:1.3;white-space:nowrap;
}
.tweet-translate-hint.visible{display:flex}
.tweet-translate-hint-icon{
  width:13px;height:13px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
}
.tweet-translate-hint-icon svg{width:100%;height:100%;display:block;fill:var(--text-secondary)}

.tweet-body{
  position:relative;z-index:2;width:100%;margin-bottom:5px;
  color:var(--text-body);font-size:16px;font-weight:580;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.tweet-body mark {
  border-radius: 2px;
  padding: 1px 3px;
  -webkit-text-fill-color: currentColor;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.tweet-body strong,.tweet-body b{font-weight:bolder}
.tweet-body em,.tweet-body i{font-style:italic}
.tweet-body u{text-decoration:underline}
.tweet-body s,.tweet-body strike,.tweet-body del{text-decoration:line-through}
.tweet-body span[style*="background-color"]{border-radius:2px;padding:1px 0}
body.dark .tweet-body span[style*="background-color"]{color:#1c1c1e}
.tweet-body.indented{text-indent:2em}
.tweet-body.indented div,.tweet-body.indented p{text-indent:2em}

.tweet-rate-translation{
  display:none;align-items:center;gap:1px;margin-top:0;margin-bottom:15px;
  color:var(--text-secondary);font-size:12px;font-weight:590;line-height:1.3;white-space:nowrap;
}
.tweet-rate-translation.visible{display:flex}
.tweet-rate-icon{width:55px;height:auto;display:inline-block;vertical-align:middle;pointer-events:none}

.tweet-meta{
  position:relative;z-index:2;width:100%;color:var(--text-secondary);
  font-size:13px;font-weight:590;line-height:1.4;overflow-wrap:anywhere;
}
body.dark .tweet-meta{color:var(--text-secondary)}
.tweet-meta-views{color:var(--text-color);font-weight:590}

.tweet-actions-bar{position:relative;z-index:999;width:100%;background:transparent;overflow:visible}
.tweet-actions-img{
  position:relative;z-index:1000;width:102%;max-width:none;height:auto;
  display:block;margin-top:-18px;margin-left:-1%;pointer-events:none;
}
.tweet-actions-numbers{position:absolute;z-index:1001;inset:0;pointer-events:none}
.action-count{
  position:absolute;color:var(--text-secondary);font-size:13px;font-weight:600;
  line-height:1;white-space:nowrap;pointer-events:none;
}
.action-count-reply{top:56%;left:8%}
.action-count-retweet{top:56%;left:31.5%}
.action-count-like{top:56%;left:54.5%}
.action-count-bookmark{top:56%;left:78%}

.bottom-tab-bar{z-index:10;width:100%;flex-shrink:0;padding:0 30px 2px;background:var(--page-bg)}
.bottom-tab-img{width:108%;max-width:none;height:auto;display:block;margin-left:-4%;pointer-events:none}

body.dark .top-nav-img,
body.dark .tweet-header-action-img,
body.dark .tweet-rate-icon {
  filter: invert(1);
}
@media(max-width:430px){
.top-nav-wrapper{padding:0 20px 0}
  .scroll-content{padding:10px 20px 24px}
  .bottom-tab-bar{padding:0 20px 2px}
}

/* 工具箱编辑界面，不改变推文成品排版 */
.editor-panel {
  --editor-bg: #fdfdfb;
  --editor-card: #ffffff;
  --editor-border: #e8e8e2;
  --editor-accent: #555650;
  --text-color: #292927;
  --text-secondary: #8f9089;

  max-width: 760px;
  margin: 0 auto;
  padding: 24px 17px 100px;
  gap: 0;
  background: var(--editor-bg);
  font-family: "Courier Prime", "Courier New", monospace;
}

body {
  background: #fdfdfb;
}

.editor-header {
  padding: 0 0 24px;
  gap: 16px;
}

.editor-header h2 {
  font-size: 22px;
  font-weight: 400;
}

.editor-section {
  padding: 22px 0;
  gap: 14px;
  border: 0;
  border-top: 1px solid var(--editor-border);
  border-radius: 0;
  background: transparent;
}

.editor-section-title {
  color: #555650;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0;
}

.editor-row,
.editor-inline,
.char-bar {
  min-width: 0;
}

.editor-inline .editor-row,
.char-bar select {
  min-width: 0;
}

.editor-row label,
.editor-toggle > label:first-child {
  color: #66675f;
  font-size: 12px;
  font-weight: 400;
}

.editor-row input[type="text"],
.editor-row input[type="number"],
.editor-row input[type="url"],
.editor-row select,
.char-bar select {
  min-height: 42px;
  border-radius: 0;
  background: #fff;
  color: #383834;
  font-size: 16px;
}

.char-btn,
.avatar-upload-label,
.btn-theme {
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid #deded7;
  border-radius: 0;
  background: #fff;
  color: #66675f;
  font-size: 12px;
  font-weight: 400;
}

.char-btn-danger {
  color: #9a6262;
}

body.dark .char-btn-danger {
  color: #9a6262;
}

.avatar-upload-label {
  justify-content: center;
}

.rich-toolbar,
.hl-bar {
  border-radius: 0;
  background: #f3f3ef;
}

.tool-btn {
  border-radius: 3px;
}

.rich-editor {
  border-radius: 0;
  background: #fff;
  color: #383834;
  font-size: 16px;
}

.floating-preview-btn {
  left: auto;
  right: 18px;
  bottom: 18px;
  transform: none;
  padding: 12px 18px;
  border: 1px solid #555650;
  border-radius: 0;
  background: #555650;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
  font-size: 12px;
  font-weight: 400;
}

.floating-preview-btn:active {
  transform: scale(0.97);
}

.preview-action-btn,
.save-modal-btn {
  border-radius: 4px;
  font-weight: 400;
}

.preview-action-btn.btn-save,
.save-modal-btn-download {
  background: #555650;
}

.editor-panel button,
.editor-panel input,
.editor-panel select {
  font-family: inherit;
}

.editor-panel button:focus-visible,
.editor-panel select:focus-visible {
  outline: 2px solid #777870;
  outline-offset: 3px;
}

/* 只有预览正文跟随“正文字体”设置 */
.tweet-body,
#notesPage .notes-original-body {
  font-family: var(
    --selected-font,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "PingFang SC",
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif
  ) !important;
}
/* ==================== 订阅按钮：调整区 ==================== */

.tweet-header-action {
  position: relative;

  /* 整个按钮的位置：数值越负，越往上 */
  margin-top: -15px;

  /* 整个按钮的位置：数值越负，越往右 */
  margin-right: -5px;
}

.tweet-header-action-img {
  /* 按钮图片宽度，文字也会跟随图片位置 */
  width: 62px;
  height: auto;
  display: block;
}

.subscribe-label {
  position: absolute;
  z-index: 1;

  /* 文字横向位置：50% 居中；增大往右，减小往左 */
  left: 50%;

  /* 文字纵向位置：50% 居中；增大往下，减小往上 */
  top: 50%;

  /* 以文字中心对齐上面的位置，通常不用改 */
  transform: translate(-50%, -50%);

  /* 字号：数值越大，字越大 */
  font-size: 12px;

  /* 粗细：400 常规，500 中等，600 较粗，700 粗体 */
  font-weight: 600;

  /* 字间距：想让“订 阅”更疏一些，可以改成 1px */
  letter-spacing: 0;

  line-height: 1;
  white-space: nowrap;
  pointer-events: none;

  /* 浅色模式文字颜色 */
  color: #ffffff;
}

/* 深色模式文字颜色 */
body.dark .subscribe-label {
  color: #000000;
}


/* ==================== 底部回复文字：调整区 ==================== */

.bottom-reply-wrap {
  position: relative;
  width: 100%;
}

.bottom-reply-label {
  /* 横向偏移：负数往左，正数往右 */
  --reply-x: -6px;

  /* 纵向偏移：负数往上，正数往下 */
  --reply-y: -40px;

  position: absolute;
  z-index: 1;

  /* 基准位置，之后通常不用改 */
  left: 12px;
  right: 45px;
  top: 50%;

  /* 先垂直居中，再按上面的像素数移动 */
  transform: translate(
    var(--reply-x),
    calc(-50% + var(--reply-y))
  );

  /* 字号 */
  font-size: 15px;

  font-weight: 550;

  /* 字间距 */
  letter-spacing: 0;

  line-height: 1.4;
  text-align: left;

  /* 保持单行，太长时显示省略号 */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  pointer-events: none;

  /* 浅色模式文字颜色 */
  color: #57616D;
}

/* 深色模式文字颜色 */
body.dark .bottom-reply-label {
  color: #929292;
}
#pageHeightRow[hidden] {
  display: none;
}

body.preview-mode {
  position: relative;
}

body.preview-mode.auto-tweet #tweetPage > .scroll-content {
  flex: none;
  height: auto;
  min-height: 0;
  max-height: none;
  overflow: visible;
}

/* 编辑页板头 */
.editor-panel > .editor-header {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0 0 40px;
}

.editor-banner {
  display: block;
  width: 150px;
  max-width: 75%;
  height: auto;
}

/* 去掉板头下方的第一条横线 */
.editor-panel > .editor-header + .editor-section {
  border-top: 0;
  padding-top: 0;
}

/* ==================== 原版备忘录视觉框架 ==================== */

.notes-only-section {
  display: none;
}

body.notes-editor-mode .notes-only-section {
  display: flex;
}


#notesPage {
  --notes-bg: #fffffe;
  --notes-text-color: #000000;
  --notes-text-body: #333333;
  --notes-text-secondary: #8e8e93;
  --notes-accent: #e4af0a;

  display: none;
  width: 430px;
  height: 932px;
  overflow: hidden;
  background: var(--notes-bg);
}

body.preview-mode.notes-editor-mode #tweetPage {
  display: none;
}

body.preview-mode.notes-editor-mode #notesPage {
  display: block;
}

#notesPage .notes-wrapper {
  width: 430px;
  height: 100%;
  overflow: hidden;
  background: var(--notes-bg);
  position: relative;
}

#notesPage .phone-container {
  width: 430px;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--notes-bg);
}

/* 原代码的图片顶栏 */
#notesPage .notes-original-top-bar {
  width: 100%;
  padding-top: 5px;
  margin-bottom: -23px;
  background: var(--notes-bg);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

#notesPage .notes-original-top-inner {
  position: relative;
  line-height: 0;
  font-size: 0;
}

#notesPage .notes-original-top-bar img {
  width: 100%;
  height: auto;
  display: block;
}

#notesPage .notes-original-folder {
  position: absolute;
  z-index: 10;
  left: 8.5%;
  bottom: 26px;
  max-width: 245px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  color: var(--notes-accent);
  font-size: 18px;
  font-weight: 550;
  letter-spacing: 0.5px;
  line-height: 1;
}

/* 自由文字编辑区域 */
#notesPage .notes-original-editor {
  padding: 20px 30px 6px;
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--notes-bg);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#notesPage .notes-original-editor::-webkit-scrollbar {
  display: none;
}

#notesPage .notes-original-date {
  padding: 2px 0 16px;
  color: var(--notes-text-secondary);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 0.2px;
  text-align: center;
}

#notesPage .notes-original-date:empty {
  display: none;
}

#notesPage .notes-original-title {
  margin: 0 0 8px;
  color: var(--notes-text-color);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

#notesPage .notes-original-title:empty {
  display: none;
}

#notesPage .notes-original-body {
  color: var(--notes-text-body);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

#notesPage .notes-original-body b,
#notesPage .notes-original-body strong {
  font-weight: 700;
}

#notesPage .notes-original-body i,
#notesPage .notes-original-body em {
  font-style: italic;
}

#notesPage .notes-original-body u {
  text-decoration: underline;
}

#notesPage .notes-original-body s,
#notesPage .notes-original-body strike,
#notesPage .notes-original-body del {
  text-decoration: line-through;
}

#notesPage .notes-original-body mark {
  border-radius: 2px;
  padding: 1px 3px;
  -webkit-text-fill-color: currentColor;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

#notesPage .notes-original-body span[style*="background-color"] {
  border-radius: 2px;
  padding: 1px 0;
}

#notesPage .notes-original-body.indented {
  text-indent: 2em;
}

#notesPage .notes-original-body.indented div,
#notesPage .notes-original-body.indented p {
  text-indent: 2em;
}

/* 原代码的图片底栏 */
#notesPage .notes-original-bottom-bar {
  width: 100%;
  height: 88px;
  margin-top: -44px;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  z-index: 20;
  background: var(--notes-bg);
  line-height: 0;
  font-size: 0;
}

#notesPage .notes-original-bottom-bar img {
  width: 100%;
  height: auto;
  display: block;
  vertical-align: top;
}

/* 浅色模式：只显示浅色顶栏和底栏 */
#notesPage img.notes-light-img {
  display: block !important;
}

#notesPage img.notes-dark-img {
  display: none !important;
}

/* 深色模式 */
body.dark #notesPage {
  --notes-bg: #000000;
  --notes-text-color: #ffffff;
  --notes-text-body: #e5e5e5;
  --notes-text-secondary: #8e8e93;
}

/* 深色模式：只显示深色顶栏和底栏 */
body.dark #notesPage img.notes-light-img {
  display: none !important;
}

body.dark #notesPage img.notes-dark-img {
  display: block !important;
}

/* 完整长图 */
body.preview-mode.auto-tweet.notes-editor-mode #notesPage {
  height: auto !important;
  min-height: 932px;
  overflow: visible;
}

body.preview-mode.auto-tweet.notes-editor-mode
#notesPage .notes-wrapper,
body.preview-mode.auto-tweet.notes-editor-mode
#notesPage .phone-container {
  height: auto;
  min-height: 932px;
  overflow: visible;
}

body.preview-mode.auto-tweet.notes-editor-mode
#notesPage .notes-original-editor {
  flex: none;
  min-height: 787px;
  height: auto;
  overflow: visible;
}

/* ==================== 推文 / 备忘录分类 ==================== */

.editor-type-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.editor-type-tab {
  min-width: 0;
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid var(--editor-border);
  border-radius: 0;
  background: #ffffff;
  color: #66675f;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
}

.editor-type-tab.active {
  border-color: #555650;
  background: #555650;
  color: #ffffff;
}

/* 默认处于推文模式，因此先隐藏备忘录设置 */
.notes-only-section {
  display: none;
}

/* 切换到备忘录后显示备忘录设置 */
body.notes-editor-mode .notes-only-section {
  display: flex;
}

/* 备忘录模式隐藏推文专属设置 */
body.notes-editor-mode .character-section,
body.notes-editor-mode .template-x {
  display: none;
}

body.notes-editor-mode .tweet-only-setting {
  display: none;
}

.rich-editor img,
.tweet-body img,
#notesPage .notes-original-body img {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  margin: 10px auto;
  object-fit: contain;
  background: transparent;
}

/* 只加宽备忘录正文：左右各扩展 10px */
#notesPage .notes-original-body {
  position: relative;
  left: -10px;
  width: calc(100% + 20px);
  max-width: none;
}

/* 备忘录标题与加宽后的正文左侧对齐 */
#notesPage .notes-original-title {
  position: relative;
  left: -10px;
}

/* ==================== 图片大小设置弹窗 ==================== */

.image-size-modal {
  display: none;
  position: fixed;
  z-index: 100000;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: "Courier Prime", "Courier New", monospace;
}

.image-size-modal.show {
  display: flex;
}

.image-size-modal-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
  background: rgba(25, 25, 23, 0.46);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  cursor: pointer;
}

.image-size-dialog {
  position: relative;
  z-index: 1;
  width: min(100%, 390px);
  max-height: min(620px, calc(100vh - 40px));
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #deded7;
  border-radius: 0;
  background: #fdfdfb;
  color: #292927;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.18);
}

.image-size-dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.image-size-dialog-header h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0;
}

.image-size-close {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border: 1px solid #deded7;
  border-radius: 0;
  background: #ffffff;
  color: #66675f;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.image-size-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 170px;
  max-height: 270px;
  margin-bottom: 18px;
  padding: 14px;
  overflow: hidden;
  border: 1px solid #e8e8e2;
  background:
    linear-gradient(45deg, #eeeeea 25%, transparent 25%),
    linear-gradient(-45deg, #eeeeea 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #eeeeea 75%),
    linear-gradient(-45deg, transparent 75%, #eeeeea 75%);
  background-color: #fafaf8;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-size: 16px 16px;
}

.image-size-preview img {
  display: block;
  width: 100%;
  max-width: 100%;
  max-height: 240px;
  object-fit: contain;
}

.image-size-control {
  padding: 15px;
  border: 1px solid #e8e8e2;
  background: #ffffff;
}

.image-size-control-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.image-size-control-header label {
  color: #66675f;
  font-size: 12px;
  font-weight: 400;
}

.image-size-number-wrap {
  display: flex;
  align-items: center;
  width: 82px;
  min-height: 38px;
  border: 1px solid #deded7;
  background: #fdfdfb;
}

.image-size-number-wrap input {
  width: 100%;
  min-width: 0;
  padding: 8px 2px 8px 10px;
  border: 0;
  outline: none;
  background: transparent;
  color: #383834;
  font-family: inherit;
  font-size: 14px;
  text-align: right;
}

.image-size-number-wrap span {
  padding-right: 10px;
  color: #8f9089;
  font-size: 13px;
}

.image-size-control input[type="range"] {
  width: 100%;
  height: 22px;
  margin: 0;
  accent-color: #555650;
  cursor: pointer;
}

.image-size-dialog-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
}

.image-size-main-actions {
  display: flex;
  gap: 8px;
}

.image-size-btn {
  min-height: 40px;
  padding: 9px 15px;
  border: 1px solid #deded7;
  border-radius: 0;
  background: #ffffff;
  color: #66675f;
  font-family: inherit;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
}

.image-size-btn:active,
.image-size-close:active {
  background: #f1f1ed;
  transform: scale(0.98);
}

.image-size-btn-apply {
  border-color: #555650;
  background: #555650;
  color: #ffffff;
}

.image-size-btn-apply:active {
  background: #454640;
}

.image-size-btn-delete {
  border-color: #d9bcbc;
  color: #9a6262;
}

.image-size-modal button:focus-visible,
.image-size-modal input:focus-visible {
  outline: 2px solid #777870;
  outline-offset: 3px;
}

body.dark .image-size-dialog {
  border-color: #343430;
  background: #1a1a18;
  color: #eeeeeb;
}

body.dark .image-size-close,
body.dark .image-size-btn,
body.dark .image-size-control {
  border-color: #3b3b37;
  background: #242421;
  color: #c8c8c2;
}

body.dark .image-size-preview {
  border-color: #343430;
  background:
    linear-gradient(45deg, #292926 25%, transparent 25%),
    linear-gradient(-45deg, #292926 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #292926 75%),
    linear-gradient(-45deg, transparent 75%, #292926 75%);
  background-color: #20201e;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-size: 16px 16px;
}

body.dark .image-size-number-wrap {

  background: #181816;
}

body.dark .image-size-number-wrap input {

}

body.dark .image-size-control-header label,
body.dark .image-size-number-wrap span {
  color: #999991;
}

body.dark .image-size-btn-apply {
  border-color: #eeeeeb;
  background: #eeeeeb;
  color: #1a1a18;
}

body.dark .image-size-btn-delete {
  border-color: #654949;
  color: #d49393;
}

@media (max-width: 430px) {
  .image-size-modal {
    align-items: flex-end;
    padding: 0;
  }

  .image-size-dialog {
    width: 100%;
    max-height: 86vh;
    padding: 18px 17px max(18px, env(safe-area-inset-bottom));
    border-right: 0;
    border-bottom: 0;
    border-left: 0;

    min-height: 145px;
    max-height: 230px;

    max-height: 200px;
  }

<script>
(function(){


var STORE_KEY='beautyEditor';

function saveStore(d){localStorage.setItem(STORE_KEY,JSON.stringify(d))}

/* ==================== 推文 / 备忘录分类 ==================== */

function setEditorType(type){
  editorType=type==='notes' ? 'notes' : 'tweet';

  document.body.classList.toggle(
    'notes-editor-mode',
    editorType==='notes'
  );

  editorTypeTabs.forEach(function(tab){
    tab.classList.toggle(
      'active',
      tab.getAttribute('data-editor-type')===editorType
    );
  });

  updatePreview();
  syncHeightMode();
  if(document.readyState==='complete'){
  autoSaveDraft();
}
}

editorTypeTabs.forEach(function(tab){
  tab.addEventListener('click',function(){
    setEditorType(tab.getAttribute('data-editor-type'));
  });
});


var editFontFamily=$('editFontFamily');
var editBold=$('editBold');
var editBodyImageFile=$('editBodyImageFile');

/* 加粗增量：可改为 50、100、150，数值越大越粗 */
var GLOBAL_WEIGHT_ADD=100;
var originalWeights=new Map();

function resetGlobalWeight(){
  originalWeights.forEach(function(old,el){
    if(old.value){
      el.style.setProperty('font-weight',old.value,old.priority);
    }else{
      el.style.removeProperty('font-weight');
    }
  });
  originalWeights.clear();
}

function applyGlobalWeight(){
  if(!editBold.checked)return;

  /* 先读取全部原始字重，避免父元素加粗后影响子元素的计算 */
  var items=Array.from(document.querySelectorAll(
  '.tweet-body, .tweet-body *, ' +
  '#notesPage .notes-original-body, ' +
  '#notesPage .notes-original-body *'
))
    .filter(function(el){
      return !el.matches('script, style, link, meta');
    })
    .map(function(el){
      var weight=parseFloat(getComputedStyle(el).fontWeight);
      return {el:el,weight:Number.isFinite(weight)?weight:400};
    });

  items.forEach(function(item){
    var el=item.el;
    originalWeights.set(el,{
      value:el.style.getPropertyValue('font-weight'),
      priority:el.style.getPropertyPriority('font-weight')
    });
    el.style.setProperty(
      'font-weight',
      String(Math.min(1000,item.weight+GLOBAL_WEIGHT_ADD)),
      'important'
    );
  });
}

var editReplyText=$('editReplyText');
var previewReplyText=$('previewReplyText');

function populateFontSelect(){
  var families=new Set();

  document.fonts.forEach(function(font){
    var family=font.family.replace(/^["']|["']$/g,'');
    if(family!=='TweetQuote')families.add(family);
  });

  families.forEach(function(family){
    var option=document.createElement('option');
    option.value=family;
    option.textContent=family;
    editFontFamily.appendChild(option);
  });
}

  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show')},2200);
}

/* ==================== 图片预缓存 ==================== */
var imgCache={};

function collectUrls(){
  var urls=[];

  document.querySelectorAll(
    '#tweetPage img, #notesPage img'
  ).forEach(function(img){
    ['src','data-light-src','data-dark-src'].forEach(function(attr){
      var u=img.getAttribute(attr);

      if(
        u &&
        u!=='about:blank' &&
        !u.startsWith('data:') &&
        !u.startsWith('blob:') &&
        urls.indexOf(u)<0
      ){
        urls.push(u);
      }
    });
  });

  return urls;
}

function cacheImg(url,pi,cb){
  if(imgCache[url]) return cb(true);
  if(pi>=3) return cb(false);
  var proxied;
  if(pi===0) proxied='https://wsrv.nl/?url='+encodeURIComponent(url);
  else if(pi===1) proxied='https://corsproxy.io/?'+encodeURIComponent(url);
  else proxied='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var c=document.createElement('canvas');
      c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      imgCache[url]=c.toDataURL('image/png');
      cb(true);
    }catch(e){cacheImg(url,pi+1,cb)}
  };
  img.onerror=function(){cacheImg(url,pi+1,cb)};
  img.src=proxied;
}

function startCaching(){
  collectUrls().forEach(function(url){cacheImg(url,0,function(){})});
}

function ensureAllCached(cb){
  var urls=collectUrls();
  var pending=urls.filter(function(u){return !imgCache[u]});
  if(pending.length===0) return cb();
  var done=false,left=pending.length;
  function finish(){if(done)return;done=true;cb()}
  pending.forEach(function(url){
    cacheImg(url,0,function(){left--;if(left<=0)finish()});
  });
  setTimeout(finish,10000);
}

function swapToCache(){
  var arr=[];
  tweetPage.querySelectorAll('img').forEach(function(img){
    var src=img.src;
    if(imgCache[src]){arr.push({el:img,orig:src});img.src=imgCache[src]}
  });
  return arr;
}
function swapBack(arr){arr.forEach(function(o){o.el.src=o.orig})}

function compressImage(file,maxSize,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      var w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){
        if(w>h){h=Math.round(h*maxSize/w);w=maxSize}
        else{w=Math.round(w*maxSize/h);h=maxSize}
      }
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.85));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function unwrapElement(element){
  var parent=element.parentNode;

  if(!parent)return;

  while(element.firstChild){
    parent.insertBefore(element.firstChild,element);
  }

  element.remove();
}

function applyHighlight(backgroundColor,textColor){
  var selection=window.getSelection();

  if(!selection.rangeCount||selection.isCollapsed){
    showToast('请先选中文字');
    return;
  }

  var range=selection.getRangeAt(0);

  if(
    !richEditor.contains(range.startContainer) ||
    !richEditor.contains(range.endContainer)
  ){
    showToast('请在编辑框中选中文字');
    return;
  }

  /*
   * 只处理当前选区里的内容。
   * 选区外已经存在的马克笔不会被拆除或修改。
   */
  var fragment=range.extractContents();

  /*
   * 清除选区内部原有的马克笔。
   * 这样给同一句话换颜色时不会产生嵌套。
   */
  Array.from(fragment.querySelectorAll('mark')).forEach(function(mark){
    unwrapElement(mark);
  });

  /*
   * 清理旧版马克笔可能留下的背景色和文字颜色，
   * 但保留粗体、斜体、下划线等其他格式。
   */
  Array.from(fragment.querySelectorAll('span[style]')).forEach(function(span){
    var hasBackground=
      span.style.background ||
      span.style.backgroundColor;

    if(!hasBackground)return;

    span.style.removeProperty('background');
    span.style.removeProperty('background-color');
    span.style.removeProperty('color');

    if(!span.getAttribute('style')){
      unwrapElement(span);
    }
  });

  Array.from(fragment.querySelectorAll('font[color]')).forEach(function(font){
    unwrapElement(font);
  });

  var newMark=document.createElement('mark');

  newMark.style.setProperty(
    'background-color',
    backgroundColor,
    'important'
  );

  newMark.style.setProperty(
    'color',
    textColor,
    'important'
  );

  newMark.appendChild(fragment);
  range.insertNode(newMark);

  richEditor.normalize();

  /*
   * 上色后继续选中当前文字，
   * 可以直接点击其他颜色进行替换。
   */
  selection.removeAllRanges();

  var finalRange=document.createRange();
  finalRange.selectNodeContents(newMark);
  selection.addRange(finalRange);
}


function removeHighlight(){
  var selection=window.getSelection();

  if(!selection.rangeCount){
    showToast('请先选中文字');
    return;
  }

  var range=selection.getRangeAt(0);

  if(!richEditor.contains(range.commonAncestorContainer)){
    showToast('请在编辑框中选中文字');
    return;
  }

  var marks=Array.from(
    richEditor.querySelectorAll('mark')
  ).filter(function(mark){
    try{
      return range.intersectsNode(mark);
    }catch(error){
      return false;
    }
  });

  if(!marks.length){
    var node=selection.anchorNode;

    if(node&&node.nodeType===3){
      node=node.parentElement;
    }

    var currentMark=node&&node.closest
      ? node.closest('mark')
      : null;

    if(currentMark&&richEditor.contains(currentMark)){
      marks=[currentMark];
    }
  }

  if(!marks.length){
    showToast('所选文字没有马克笔');
    return;
  }

  marks.forEach(function(mark){
    var parent=mark.parentNode;

    while(mark.firstChild){
      parent.insertBefore(mark.firstChild,mark);
    }

    parent.removeChild(mark);
    parent.normalize();
  });

  selection.removeAllRanges();
  updatePreview();
}

/* ==================== 中文引号字体处理 ==================== */
/*
 * 只有“系统默认”时，才单独使用苹方修正中文引号。
 * 如果选择了其他字体，则完全交给所选字体自己显示引号。
 */
function formatChineseQuotes(html) {

  /*
   * editFontFamily.value 为空，
   * 代表当前选择的是“系统默认”。
   *
   * 选择了其他字体时，直接原样返回，
   * 不给引号套 PingFang SC。
   */
  if (editFontFamily.value) {
    return html;
  }

  var container = document.createElement('div');
  container.innerHTML = html;

  var walker = document.createTreeWalker(
    container,
    NodeFilter.SHOW_TEXT
  );

  var textNodes = [];
  var node;

  while ((node = walker.nextNode())) {
    if (
      node.parentElement &&
      !node.parentElement.closest('.chinese-quote')
    ) {
      textNodes.push(node);
    }
  }

  textNodes.forEach(function(textNode) {
    if (!/[“”‘’]/.test(textNode.nodeValue)) {
      return;
    }

    var fragment = document.createDocumentFragment();
    var pieces = textNode.nodeValue.split(/([“”‘’])/);

    pieces.forEach(function(piece) {
      if (/^[“”‘’]$/.test(piece)) {
        var quote = document.createElement('span');
        quote.className = 'chinese-quote';
        quote.textContent = piece;
        fragment.appendChild(quote);
      } else if (piece) {
        fragment.appendChild(document.createTextNode(piece));
      }
    });

    textNode.parentNode.replaceChild(fragment, textNode);
  });

  return container.innerHTML;
}

var fadeTimer=null;

var pageHeightRow = $('pageHeightRow');

  var automatic = editHeightMode.value === 'auto';

function getPageHeight() {
  var activePage=getActivePage();

  if(editHeightMode.value!=='auto'){
    return Math.max(
      300,
      Math.min(3000,Number(editPageHeight.value)||932)
    );
  }

  var oldWidth=activePage.style.width;
  var oldHeight=activePage.style.height;

  activePage.style.width=BASE_WIDTH+'px';
  activePage.style.height='auto';

  var height=Math.ceil(activePage.offsetHeight);

  activePage.style.width=oldWidth;
  activePage.style.height=oldHeight;

  return Math.max(1,height);
}

function applyScale(){
  syncHeightMode();

  var activePage=getActivePage();
  var inactivePage=
    editorType==='notes' ? tweetPage : notesPage;

  inactivePage.style.cssText='';

  var sw=window.innerWidth;
  var sh=window.innerHeight;
  var ph=getPageHeight();
  var automatic=editHeightMode.value==='auto';

  var scale=automatic
    ? Math.min(sw/BASE_WIDTH,1)
    : Math.min(sw/BASE_WIDTH,sh/ph,1);

  var width=BASE_WIDTH*scale;
  var height=ph*scale;
  var left=Math.max(0,(sw-width)/2);
  var top=automatic ? 0 : Math.max(0,(sh-height)/2);

  Object.assign(activePage.style,{
    width:BASE_WIDTH+'px',
    height:ph+'px',
    position:automatic ? 'absolute' : 'fixed',
    top:top+'px',
    left:left+'px',
    transform:'scale('+scale+')',
    transformOrigin:'top left'
  });

  document.body.style.height=automatic
    ? Math.max(sh,Math.ceil(height))+'px'
    : '';
}

var layoutFrame = null;

function refreshPreviewLayout() {
  if (!document.body.classList.contains('preview-mode')) return;
  if (layoutFrame !== null) return;

  layoutFrame = requestAnimationFrame(function() {
    layoutFrame = null;
    applyScale();
  });
}

document.querySelectorAll(
  '#tweetPage img, #notesPage img'
).forEach(function(img){
  img.addEventListener('load',refreshPreviewLayout);
});

if (document.fonts) {
  document.fonts.addEventListener(
    'loadingdone',
    refreshPreviewLayout
  );
}

function showPreviewBtns(){
  previewActions.classList.remove('fade-out');
  clearTimeout(fadeTimer);
}

function togglePreviewBtns(){
  previewActions.classList.toggle('fade-out');
}

/* 记住进入预览之前，编辑页滚动到哪里 */
var editorScrollTop = 0;

btnEnter.addEventListener('click', function() {
  editorScrollTop =
    window.scrollY ||
    document.documentElement.scrollTop ||
    document.body.scrollTop ||
    0;

  /* 收起手机键盘，再进入预览 */
  if (
    document.activeElement &&
    typeof document.activeElement.blur === 'function'
  ) {
    document.activeElement.blur();
  }

  updatePreview();
  document.body.classList.add('preview-mode');
  window.scrollTo(0, 0);
  applyScale();
  showPreviewBtns();
});

window.addEventListener('resize',function(){
  if(document.body.classList.contains('preview-mode'))applyScale();
});

tweetPage.addEventListener('click',function(event){
  if(event.target.closest('.preview-actions'))return;
  togglePreviewBtns();
});

notesPage.addEventListener('click',function(event){
  if(event.target.closest('.preview-actions'))return;
  togglePreviewBtns();
});

btnBack.addEventListener('click', function(e) {
  e.stopPropagation();

  /* 取消尚未执行的预览布局更新 */
  if (layoutFrame !== null) {
    cancelAnimationFrame(layoutFrame);
    layoutFrame = null;
  }

  document.body.classList.remove('preview-mode');
  document.body.style.height = '';
  tweetPage.style.cssText = '';
notesPage.style.cssText = '';
  clearTimeout(fadeTimer);

  /* 等编辑面板恢复显示，再回到原来的位置 */
  requestAnimationFrame(function() {
    window.scrollTo({
      top: editorScrollTop,
      left: 0,
      behavior: 'instant'
    });
  });
});

/* ==================== 草稿 ==================== */
var draftTimer=null;
function autoSaveDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,300)}

function saveDraft(){
  var d=loadStore();
  d.draft={
    charId:charSelect.value,avatar:editAvatar.value,
    name:editName.value,handle:editHandle.value,verified:editVerified.checked,
    showTranslate:editShowTranslate.checked,transLang:editTransLang.value,
    showRate:editShowRate.checked,body:richEditor.innerHTML,
    indent:editIndent.checked,fontSize:editFontSize.value,
    lineHeight:editLineHeight.value,fontWeight:editFontWeight.value,
fontFamily:editFontFamily.value,
bold:editBold.checked,
    reply:editReply.value,retweet:editRetweet.value,
    like:editLike.value,bookmark:editBookmark.value,
    timeSync:editTimeSync.checked,time:editTime.value,
    date:editDate.value,views:editViews.value,
pageHeight:editPageHeight.value,
heightMode:editHeightMode.value,
replyText:editReplyText.value,
editorType:editorType,
notesFolder:editNotesFolder.value,
notesTitle:editNotesTitle.value,
notesShowDate:editNotesShowDate.checked
  };
  saveStore(d);
}

function loadDraft(){
  var d=loadStore();if(!d.draft)return false;
  var r=d.draft;

editorType=r.editorType==='notes'?'notes':'tweet';

editNotesFolder.value=r.notesFolder||'备忘录';
editNotesTitle.value=r.notesTitle||'';
editNotesShowDate.checked=
  r.notesShowDate!==false;

editHeightMode.value = r.heightMode === 'auto' ? 'auto' : 'fixed';
  syncHeightMode();
  if(r.charId&&r.charId!=='__new__')charSelect.value=r.charId;
  editAvatar.value=r.avatar||'';editName.value=r.name||'';
  editHandle.value=r.handle||'';editVerified.checked=!!r.verified;
  editShowTranslate.checked=!!r.showTranslate;editTransLang.value=r.transLang||'';
  editShowRate.checked=!!r.showRate;
  if(r.body&&r.body!=='<br>'&&r.body!=='<div><br></div>'){richEditor.innerHTML=r.body}
  else{richEditor.innerHTML=''}
  editIndent.checked=!!r.indent;
  editFontSize.value=r.fontSize||'16';editLineHeight.value=r.lineHeight||'1.55';
  editFontWeight.value=r.fontWeight||'580';
editFontFamily.value=r.fontFamily||'';
if(editFontFamily.selectedIndex<0)editFontFamily.value='';
editBold.checked=!!r.bold;
editReplyText.value=
  typeof r.replyText==='string'
    ? r.replyText
    : '发布你的回复';
  editReply.value=r.reply||'';editRetweet.value=r.retweet||'';
  editLike.value=r.like||'';editBookmark.value=r.bookmark||'';
  editViews.value=r.views||'';editPageHeight.value=r.pageHeight||'932';
  if(r.timeSync===false){
    editTimeSync.checked=false;editTime.value=r.time||'';editDate.value=r.date||'';
    editTime.readOnly=false;editDate.readOnly=false;
  }else{editTimeSync.checked=true}
  return true;
}

/* ==================== 初始化 ==================== */
function init(){
  var d=loadStore();
  if(d.darkMode)document.body.classList.add('dark');
  $('editDarkMode').checked=!!d.darkMode;
populateCharSelect();
populateFontSelect();
var hasDraft=loadDraft();
setEditorType(editorType);
  if(editTimeSync.checked)startSync();
  checkEditorEmpty();
  updateAvatarThumb();
  updateActionsImage();
  updatePreview();
  setTimeout(startCaching,800);
  if(hasDraft)showToast('草稿已恢复 ✓');
}

init();

})();
</script>
